<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TURN LAB</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#171717;background:#f6f5f8}*{box-sizing:border-box}body{margin:0}header{background:#171717;color:white;padding:24px max(18px,calc((100vw - 850px)/2))}header h1{font-size:36px;letter-spacing:-2px;margin:0}header p{margin:2px 0;color:#ccc}main{max-width:850px;margin:auto;padding:18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 13px;background:#e5dff1;color:#171717;font-weight:650}button.primary,nav button.active{background:#171717;color:white}.card{background:white;border:1px solid #e7e4eb;border-radius:17px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid button{text-align:left;min-height:90px;font-size:18px}.muted{color:#666;font-size:13px}.line{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.line>div:first-child{flex:1;min-width:170px}.line strong{display:block}.pill{font-size:12px;border-radius:100px;padding:5px 9px;background:#f1edf6;display:inline-block;margin-top:5px}select,input{border:1px solid #ccc;border-radius:10px;padding:9px;background:white;max-width:100%}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:13px;padding:8px 10px}progress{width:100%;height:14px;accent-color:#5e9475}.hide{display:none}h2{margin-top:8px}a{color:#4d3979;font-weight:650}.warn{color:#98531d}.routine{border-left:5px solid #b8a8d2}.safety{background:#fff3e3;padding:12px;border-radius:10px;font-size:13px}footer{padding:20px;text-align:center;color:#777;font-size:12px}@media print{header,nav,.noprint,button,select,.safety{display:none!important}body{background:white}.card{break-inside:avoid}.routine{border:1px solid #bbb}}@media(max-width:500px){.grid{grid-tem st GROUPS=['Reck','Minitramp','Sprung','Boden','Barren','Schwebebalken'];const EMOJI={'Reck':'🤸','Minitramp':'⚡','Sprung':'🏃','Boden':'🔄','Barren':'💪','Schwebebalken':'⚖️'};let view='home',group='Reck',editing=null;let state;try{state=JSON.parse(localStorage.getItem('turnlab-v1'))||{statuses:{},routines:[]}}catch(e){state={statuses:{},routines:[]}};function save(){localStorage.setItem('turnlab-v1',JSON.stringify(state))}function el(id){return document.getElementById(id)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function name(x){return esc(x.name)}function status(id){return state.statuses[id]||'new'}function statusLabel(s){return {new:'⚪ Noch nicht begonnen',practice:'🟠 Übe ich gerade',done:'🟢 Kann ich!'}[s]}function selector(x){return `<select aria-label="Trainingsstatus für ${name(x)}" onchange="state.statuses['${x.id}']=this.value;save();render()">${[['new','Noch nicht begonnen'],['practice','Übe ich gerade'],['done','Kann ich!']].map(([v,t])=>`<option value="${v}" ${status(x.id)===v?'selected':''}>${t}</option>`).join('')}</select>`}function video(x){return x.url?`<button class="small" onclick="showVideo('${x.id}')">▶ Video ansehen</button>`:`<span class="muted warn">Video-Link noch prüfen</span>`}function showVideo(id){let x=EXERCISES.find(e=>e.id===id);if(!x||!x.url)return;let u=new URL(x.url),v=u.hostname.includes('youtu.be')?u.pathname.slice(1):u.searchParams.get('v');let m=el('videoModal');el('videoTitle').textContent=x.name;el('videoExternal').href=x.url;el('videoPlayer').innerHTML=v&&/^[a-zA-Z0-9_-]{11}$/.test(v)?`<iframe class="video-frame" src="https://www.youtube.com/embed/${v}?playsinline=1&rel=0" title="${esc(x.name)}" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`:'<p>Dieses Video kann nicht eingebettet werden. Bitte auf YouTube öffnen.</p>';m.classList.remove('hide')}function closeVideo(){el('videoPlayer').innerHTML='';el('videoModal').classList.add('hide')}function stats(xs){let d=xs.filter(x=>status(x.id)==='done').length,p=xs.filter(x=>status(x.id)==='practice').length;return `<p class="muted">${d} geschafft · ${p} in Übung · ${xs.length} insgesamt</p><progress value="${d}" max="${xs.length}"></progress>`}function go(g){group=g;view='group';render()}function render(){document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['home','progress','routines','backup'].indexOf(view)===i));let h='';if(view==='home'){h=`<h2>Wähle dein Gerät</h2><div class="card">${stats(EXERCISES)}</div><div class="grid">${GROUPS.map(g=>`<button onclick="go('${g}')">${EMOJI[g]} ${g}<div class="muted">${EXERCISES.filter(x=>x.group===g).length} Übungen</div></button>`).join('')}</div><p class="safety">⚠️ Trainiere nur an freigegebenen Geräten mit der vorgeschriebenen Absicherung und Hilfestellung. Ein Video ersetzt keine Anleitung durch die Lehrkraft.</p>`}if(view==='group'||view==='progress'){let xs=view==='group'?EXERCISES.filter(x=>x.group===group):EXERCISES;h=`<h2>${view==='group'?EMOJI[group]+' '+group:'Mein Fortschritt'}</h2><div class="card">${stats(xs)}</div>${view==='group'?`<button class="primary noprint" onclick="create('${group}')">+ Neue ${esc(group)}-Kür</button><p></p>`:''}${xs.map(x=>`<div class="card line"><div><strong>${name(x)}</strong><span class="pill">${statusLabel(status(x.id))}</span><p style="margin-bottom:0">${video(x)}</p></div><div>${selector(x)}</div></div>`).join('')}`}if(view==='routines'){h=`<h2>Meine Wunschküren</h2><p class="muted">Wähle Elemente aus, auch wenn du sie noch übst. Tippe auf das Video, um gezielt zu trainieren.</p><div class="actions noprint">${GROUPS.map(g=>`<button class="small" onclick="create('${g}')">+ ${g}</button>`).join('')}</div><p></p>${state.routines.map((r,i)=>`<div class="card"><div class="line"><div><strong>${esc(r.title)}</strong><span class="muted">${esc(r.group)} · ${r.ids.length} Elemente</span></div><div class="actions noprint"><button class="small" onclick="editing=${i};view='edit';render()">Bearbeiten</button><button class="small" onclick="printRoutine(${i})">PDF / Drucken</button><button class="small" onclick="removeRoutine(${i})">Löschen</button></div></div>${r.ids.map((id,j)=>{let x=EXERCISES.find(e=>e.id===id);return x?`<p>${j+1}. ${name(x)} · ${statusLabel(status(id))} · ${video(x)}</p>`:''}).join('')}</div>`).join('')||'<div class="card">Noch keine Kür gespeichert.</div>'}`}if(view==='edit'){let r=state.routines[editing];if(!r){view='routines';return render()}let pool=EXERCISES.filter(x=>x.group===r.group);h=`<h2>Kür-Designer · ${esc(r.group)}</h2><div class="card"><label>Name deiner Kür<br><input id="routineTitle" value="${esc(r.title)}" oninput="state.routines[editing].title=this.value;save()"></label></div><p class="muted">Reihenfolge mit ↑ und ↓ ändern oder am Handy per Ziehen verschieben.</p>${r.ids.map((id,i)=>{let x=EXERCISES.find(e=>e.id===id);return x?`<div class="card routine" draggable="true" ondragstart="dragIndex=${i}" ondragover="event.preventDefault()" ondrop="event.preventDefault();move(dragIndex,${i})"><div class="line"><div><strong>${i+1}. ${name(x)}</strong><span class="pill">${statusLabel(status(id))}</span><p>${video(x)}</p>${selector(x)}</div><div class="actions noprint"><button class="small" onclick="move(${i},${i-1})" ${i===0?'disabled':''}>↑</button><button class="small" onclick="move(${i},${i+1})" ${i===r.ids.length-1?'disabled':''}>↓</button><button class="small" onclick="delExercise(${i})">✕</button></div></div></div>`:''}).join('')}<div class="card noprint"><strong>Element hinzufügen</strong><p><select id="addEx"><option value="">Übung auswählen</option>${pool.filter(x=>!r.ids.includes(x.id)).map(x=>`<option value="${x.id}">${name(x)}</option>`).join('')}</select> <button onclick="addExercise()">+ Hinzufügen</button></p></div><div class="actions noprint"><button class="primary" onclick="view='routines';render()">✓ Kür speichern</button><button onclick="printRoutine(${editing})">PDF / Drucken</button></div>`}if(view==='backup'){h=`<h2>Fortschritt sichern</h2><div class="card"><p>Dein Fortschritt wird automatisch auf diesem Handy im Browser gespeichert. Löscht du Browserdaten oder wechselst du das Gerät, kann er verloren gehen.</p><button class="primary" onclick="downloadBackup()">⬇ Sicherungsdatei herunterladen</button><p>Vorhandene Sicherung wiederherstellen:</p><input type="file" accept=".json,application/json" onchange="restore(event)"></div>`}el('app').innerHTML=h}let dragIndex=-1;function create(g){state.routines.push({title:'Meine '+g+'-Kür',group:g,ids:[]});editing=state.routines.length-1;save();view='edit';render()}function move(a,b){let r=state.routines[editing];if(b<0||b>=r.ids.length)return;let [id]=r.ids.splice(a,1);r.ids.splice(b,0,id);save();render()}function addExercise(){let id=el('addEx').value;if(id&&!state.routines[editing].ids.includes(id)){state.routines[editing].ids.push(id);save();render()}}function delExercise(i){state.routines[editing].ids.splice(i,1);save();render()}function removeRoutine(i){if(confirm('Diese Kür wirklich löschen?')){state.routines.splice(i,1);save();render()}}function printRoutine(i){let r=state.routines[i];let w=window.open('','_blank');if(!w){alert('Bitte Pop-ups für den PDF-Export erlauben.');return}let html=`<!doctype html><html lang="de"><meta charset="utf-8"><title>${esc(r.title)}</title><style>body{font-family:Arial,sans-serif;padding:35px;color:#171717}h1{font-size:32px}li{padding:12px;border-bottom:1px solid #ddd}small{color:#555}.noprint{margin:20px 0}@media print{.noprint{display:none}}</style><h1>TURN LAB · ${esc(r.title)}</h1><p>Gerät: ${esc(r.group)}</p><p>Name: ______________________________ Klasse: ____________</p><ol>${r.ids.map(id=>{let x=EXERCISES.find(e=>e.id===id);return x?`<li>${name(x)}<br><small>${statusLabel(status(id))}</small></li>`:''}).join('')}</ol><h3>Notizen</h3><p>__________________________________________________________________</p><p>__________________________________________________________________</p><button class="noprint" onclick="window.print()">Drucken / Als PDF sichern</button></html>`;w.document.write(html);w.document.close()}function downloadBackup(){let blob=new Blob([JSON.stringify({app:'turnlab',version:1,state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TURN-LAB-Sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(e){try{let d=JSON.parse(await e.target.files[0].text());if(d.app!=='turnlab'||!d.state||typeof d.state.statuses!=='object'||!Array.isArray(d.state.routines))throw Error();if(confirm('Aktuellen Fortschritt durch diese Sicherung ersetzen?')){state=d.state;save();view='home';render()}}catch(err){alert('Diese Datei ist keine gültige TURN-LAB-Sicherung.')}}render();</script></html>
